<script type="text/worker">
    on("change:str change:dex change:con change:int change:wis change:cha change:str_wound_minor change:str_wound_moderate change:str_wound_severe change:str_wound_terminal change:dex_wound_minor change:dex_wound_moderate change:dex_wound_severe change:dex_wound_terminal change:con_wound_minor change:con_wound_moderate change:con_wound_severe change:con_wound_terminal change:int_wound_minor change:int_wound_moderate change:int_wound_severe change:int_wound_terminal change:wis_wound_minor change:wis_wound_moderate change:wis_wound_severe change:wis_wound_terminal change:cha_wound_minor change:cha_wound_moderate change:cha_wound_severe change:cha_wound_terminal sheet:opened", function(val) {
        const stats = ["str", "dex", "con", "int", "wis", "cha"];
        const attrsToGet = [...stats];
        
        // Add all wound attributes to fetch
        for (let stat of stats) {
            attrsToGet.push(`${stat}_wound_minor`, `${stat}_wound_moderate`, `${stat}_wound_severe`, `${stat}_wound_terminal`);
        }
        
        getAttrs(attrsToGet, function(values) {
            let updates = {};
            for (let stat of stats) {
                let value = parseInt(values[stat]) || 0;
                let mod = getModifier(value);
                updates[`${stat}_mod`] = mod;
                
                // Calculate injury modifier
                let injuryMod = 0;
                if (parseInt(values[`${stat}_wound_minor`]) > 0) injuryMod += 1;
                if (parseInt(values[`${stat}_wound_moderate`]) > 0) injuryMod += 1;
                if (parseInt(values[`${stat}_wound_severe`]) > 0) injuryMod += 1;
                if (parseInt(values[`${stat}_wound_terminal`]) > 0) injuryMod += 1;
                
                updates[`${stat}_mod_current`] = mod - injuryMod;
                console.log(`Stat: ${stat}, Value: ${value}, Mod: ${mod}, Injury Mod: ${injuryMod}`);
            }
            setAttrs(updates);
        });
    });

    // Enforce wound freshness hierarchy: more severe wounds can't be fresher than less severe ones
    on("change:str_wound_minor change:str_wound_moderate change:str_wound_severe change:str_wound_terminal change:dex_wound_minor change:dex_wound_moderate change:dex_wound_severe change:dex_wound_terminal change:con_wound_minor change:con_wound_moderate change:con_wound_severe change:con_wound_terminal change:int_wound_minor change:int_wound_moderate change:int_wound_severe change:int_wound_terminal change:wis_wound_minor change:wis_wound_moderate change:wis_wound_severe change:wis_wound_terminal change:cha_wound_minor change:cha_wound_moderate change:cha_wound_severe change:cha_wound_terminal", function(eventInfo) {
        const stats = ["str", "dex", "con", "int", "wis", "cha"];
        const allWoundAttrs = [];
        
        for (let stat of stats) {
            allWoundAttrs.push(`${stat}_wound_minor`, `${stat}_wound_moderate`, `${stat}_wound_severe`, `${stat}_wound_terminal`);
        }
        
        getAttrs(allWoundAttrs, function(values) {
            let updates = {};
            
            for (let stat of stats) {
                let minor = parseInt(values[`${stat}_wound_minor`]) || 0;
                let moderate = parseInt(values[`${stat}_wound_moderate`]) || 0;
                let severe = parseInt(values[`${stat}_wound_severe`]) || 0;
                let terminal = parseInt(values[`${stat}_wound_terminal`]) || 0;
                
                // Enforce hierarchy: if a more severe wound is fresher, upgrade lesser wounds
                // Terminal sets minimum for all others
                if (terminal > 0) {
                    if (severe < terminal) updates[`${stat}_wound_severe`] = terminal;
                    if (moderate < terminal) updates[`${stat}_wound_moderate`] = terminal;
                    if (minor < terminal) updates[`${stat}_wound_minor`] = terminal;
                }
                // Severe sets minimum for moderate and minor (if not already set by terminal)
                if (severe > 0) {
                    if (moderate < severe) updates[`${stat}_wound_moderate`] = severe;
                    if (minor < severe) updates[`${stat}_wound_minor`] = severe;
                }
                // Moderate sets minimum for minor (if not already set)
                if (moderate > 0) {
                    if (minor < moderate) updates[`${stat}_wound_minor`] = moderate;
                }
            }
            
            // Only update if there are changes
            if (Object.keys(updates).length > 0) {
                setAttrs(updates);
            }
        });
    });

    // Calculate max armor based on equipment
    on("change:armor_equipped sheet:opened", function() {
        getAttrs(["armor_equipped", "current_armor", "max_armor"], function(values) {
            let newMaxArmor = parseInt(values.armor_equipped) || 0;
            let oldMaxArmor = parseInt(values.max_armor) || 0;
            let currentArmor = parseInt(values.current_armor) || 0;
            
            let updates = {
                "max_armor": newMaxArmor
            };
            
            // If max armor increased, add the difference to current armor
            if (newMaxArmor > oldMaxArmor) {
                updates["current_armor"] = currentArmor + (newMaxArmor - oldMaxArmor);
            }
            // If max armor decreased, cap current armor at new max
            else if (currentArmor > newMaxArmor) {
                updates["current_armor"] = newMaxArmor;
            }
            
            setAttrs(updates);
        });
    });

    // Calculate max shield based on equipment
    on("change:shield_equipped sheet:opened", function() {
        getAttrs(["shield_equipped", "current_shield", "max_shield"], function(values) {
            let newMaxShield = parseInt(values.shield_equipped) || 0;
            let oldMaxShield = parseInt(values.max_shield) || 0;
            let currentShield = parseInt(values.current_shield) || 0;
            
            let updates = {
                "max_shield": newMaxShield
            };
            
            // If max shield increased, add the difference to current shield
            if (newMaxShield > oldMaxShield) {
                updates["current_shield"] = currentShield + (newMaxShield - oldMaxShield);
            }
            // If max shield decreased, cap current shield at new max
            else if (currentShield > newMaxShield) {
                updates["current_shield"] = newMaxShield;
            }
            
            setAttrs(updates);
        });
    });

    // Calculate max magic resistance based on equipment
    on("change:magic_resistance sheet:opened", function() {
        getAttrs(["magic_resistance", "current_magic_resistance", "max_magic_resistance"], function(values) {
            let newMaxMagic = parseInt(values.magic_resistance) || 0;
            let oldMaxMagic = parseInt(values.max_magic_resistance) || 0;
            let currentMagic = parseInt(values.current_magic_resistance) || 0;
            
            let updates = {
                "max_magic_resistance": newMaxMagic
            };
            
            // If max magic increased, add the difference to current magic
            if (newMaxMagic > oldMaxMagic) {
                updates["current_magic_resistance"] = currentMagic + (newMaxMagic - oldMaxMagic);
            }
            // If max magic decreased, cap current magic at new max
            else if (currentMagic > newMaxMagic) {
                updates["current_magic_resistance"] = newMaxMagic;
            }
            
            setAttrs(updates);
        });
    });

    // Handle armor spending
    on("change:armor_spent", function() {
        getAttrs(["armor_spent", "current_armor"], function(values) {
            let armorSpent = parseInt(values.armor_spent) || 0;
            let currentArmor = parseInt(values.current_armor) || 0;
            
            // Prevent spending more than available
            if (armorSpent > currentArmor) {
                armorSpent = currentArmor;
            }
            
            // Prevent negative values
            if (armorSpent < 0) {
                armorSpent = 0;
            }
            
            let newCurrentArmor = currentArmor - armorSpent;
            
            setAttrs({
                "current_armor": newCurrentArmor,
                "armor_spent": 0  // Reset spent after applying
            });
        });
    });

    // Handle shield spending
    on("change:shield_spent", function() {
        getAttrs(["shield_spent", "current_shield"], function(values) {
            let shieldSpent = parseInt(values.shield_spent) || 0;
            let currentShield = parseInt(values.current_shield) || 0;
            
            // Prevent spending more than available
            if (shieldSpent > currentShield) {
                shieldSpent = currentShield;
            }
            
            // Prevent negative values
            if (shieldSpent < 0) {
                shieldSpent = 0;
            }
            
            let newCurrentShield = currentShield - shieldSpent;
            
            setAttrs({
                "current_shield": newCurrentShield,
                "shield_spent": 0  // Reset spent after applying
            });
        });
    });

    // Handle magic resistance spending
    on("change:magic_resistance_spent", function() {
        getAttrs(["magic_resistance_spent", "current_magic_resistance"], function(values) {
            let magicSpent = parseInt(values.magic_resistance_spent) || 0;
            let currentMagic = parseInt(values.current_magic_resistance) || 0;
            
            // Prevent spending more than available
            if (magicSpent > currentMagic) {
                magicSpent = currentMagic;
            }
            
            // Prevent negative values
            if (magicSpent < 0) {
                magicSpent = 0;
            }
            
            let newCurrentMagic = currentMagic - magicSpent;
            
            setAttrs({
                "current_magic_resistance": newCurrentMagic,
                "magic_resistance_spent": 0  // Reset spent after applying
            });
        });
    });

    function calculate_derived_stats() {
        getAttrs([
            "str",
            "dex",
            "con",
            "int",
            "wis",
            "cha"
        ], function(values) {
            let derived_stats = {};
            for (let stat of ["str", "dex", "con", "int", "wis", "cha"]) {
                let injuryMod = getInjury(stat);
                let statValue = parseInt(values[stat]) || 0;
                let mod = getModifier(statValue) - injuryMod;
                derived_stats[`${stat}_mod`] = mod;
            }
            setAttrs(derived_stats);
        });
    }

    function getModifier(value) {
        const ranges = [
            { max: 0, mod: -4 },
            { max: 2, mod: -3 },
            { max: 4, mod: -2 },
            { max: 8, mod: -1 },
            { max: 12, mod: 0 },
            { max: 15, mod: 1 },
            { max: 17, mod: 2 },
            { max: 18, mod: 3 },
            { max: 19, mod: 4 },
            { max: 20, mod: 5 }
        ];
        
        return ranges.find(r => value <= r.max)?.mod ?? "";
    }

    function getInjury(stat) {
        let statName = stat.toLowerCase();
        getAttrs([
            `${statName}_wound_minor`,
            `${statName}_wound_moderate`,
            `${statName}_wound_severe`,
            `${statName}_wound_terminal`
        ], function(values) {
            let injury = 0;
            if (values[`${statName}_wound_minor`] > 0) injury += 1;
